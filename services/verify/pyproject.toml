[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gatehouse-verify"
version = "0.1.0"
description = "Gatehouse KY-A verify service: assessment, issuance, understanding-as-key, harness binding"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.22"]

[tool.setuptools]
packages = ["gatehouse_verify"]

[tool.setuptools.package-data]
gatehouse_verify = ["*.json"]
